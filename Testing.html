<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COA &amp; Lab Testing - Sasquatch Muscle</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; color: #9E9D5A; background-color: #02090F; }
    .banner-wrapper { margin-bottom: 1rem; border-radius: 10px; overflow: hidden; border: 1px solid #c3dcc7; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.12); background: #0f2419; }
    .banner-img { width: 100%; height: auto; display: block; object-fit: cover; }
    .nav-bar { display: flex; gap: 0.75rem; margin-bottom: 1.5rem; }
    .nav-link { display: inline-block; background: #262B27; color: #9E9D5A; border: 1px solid #c3dcc7; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-weight: 600; font-size: 0.95rem; }
    .nav-link:hover { background: #593210; color: #ffffff; }
    .nav-link.active { background: #163020; color: #ffea00; border-color: #ffea00; }
    .content-box { background: #262B27; border: 1px solid #c3dcc7; border-radius: 8px; padding: 1.5rem; }
    .coa-list { list-style: none; padding: 0; margin: 1rem 0 0 0; }
    .coa-item { display: flex; justify-content: space-between; align-items: center; padding: 0.85rem 0; border-bottom: 1px solid #3c443e; gap: 1rem; flex-wrap: wrap; }
    .coa-item:last-child { border-bottom: none; }
    .coa-meta { color: #b0b8c0; font-size: 0.9rem; }
    .coa-btn { background: #593210; color: #ffffff; text-decoration: none; padding: 0.5rem 1rem; border-radius: 6px; font-size: 0.9rem; font-weight: 600; }
    .coa-btn:hover { background: #0550ae; }
  </style>
</head>
<body>

  <div class="banner-wrapper">
    <img src="SasquatchLargeBanner.jpg" alt="Sasquatch Muscle" class="banner-img">
  </div>

  <nav class="nav-bar">
    <a href="index.html" class="nav-link">&larr; Store</a>
    <a href="Testing.html" class="nav-link active">COA / Testing</a>
  </nav>

  <div class="content-box">
    <h1>Lab Testing &amp; Certificates of Analysis (COA)</h1>
    <p>Select any product below to view its third-party lab testing report (listed A&ndash;Z):</p>
    <ul class="coa-list" id="coa-list"></ul>
  </div>

  <script>
    // Add or edit your lab reports here in any order—they will automatically display A–Z
    const reports = [
      { name: "Sasquatch Testosterone E (300mg/ml)", meta: "Batch #001 • Third-Party Lab Report", url: "https://example.com" },
      { name: "Sasquatch Testosterone C (250mg/ml)", meta: "Batch #001 • Third-Party Lab Report", url: "https://example.com" },
      { name: "Sasquatch Testosterone P (100mg/ml)", meta: "Batch #001 • Third-Party Lab Report", url: "https://example.com" },
      { name: "Sasquatch Testosterone A (125mg/ml)", meta: "Batch #001 • Third-Party Lab Report", url: "https://example.com" },
      { name: "Sasquatch Sustanon 250 (250mg/ml)", meta: "Batch #001 • Third-Party Lab Report", url: "https://example.com" },
      { name: "Sasquatch Eq-Boldenone Undecylenate (300mg/ml)", meta: "Batch #001 • Third-Party Lab Report", url: "https://example.com" },
      { name: "Sasquatch Nandrolone Decanoate (200mg/ml)", meta: "Batch #001 • Third-Party Lab Report", url: "https://example.com" },
      { name: "Sasquatch Trenbolone E (250mg/ml)", meta: "Batch #001 • Third-Party Lab Report", url: "https://example.com" },
      { name: "Sasquatch Masteron E (200mg/ml)", meta: "Batch #001 • Third-Party Lab Report", url: "https://example.com" }
    ];

    function renderReports() {
      const list = document.getElementById("coa-list");
      if (!list) return;

      const sorted = reports.slice().sort(function(a, b) {
        return a.name.localeCompare(b.name);
      });

      let html = "";
      for (let i = 0; i < sorted.length; i++) {
        const item = sorted[i];
        html += '<li class="coa-item">' +
          '<div><strong>' + item.name + '</strong><br>' +
          '<span class="coa-meta">' + item.meta + '</span></div>' +
          '<a href="' + item.url + '" target="_blank" rel="noopener" class="coa-btn">View COA</a>' +
          '</li>';
      }
      list.innerHTML = html;
    }

    renderReports();
  </script>
</body>
</html>
